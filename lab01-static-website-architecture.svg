<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Azure Lab 01 — Static Website Hosting with Blob Storage</title>
<desc id="desc">Azure for Students subscription contains resource group rg-staticwebhosting-mark and storage account stlab01mark2026 in North Central US. Static website enabled, index.html served from $web container over HTTPS to visitors. Blob and container soft delete are set to seven days. Azure Policy restricts deployment regions.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081a32"/><stop offset="1" stop-color="#122c49"/></linearGradient><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity=".2"/></filter></defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<text x="72" y="74" fill="#f8fafc" font-family="Arial,sans-serif" font-size="35" font-weight="700">AZURE LAB 01</text>
<text x="72" y="113" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="24">Static Website Hosting • Azure Blob Storage</text>
<text x="72" y="147" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="16">Deployed architecture  |  North Central US  |  Azure for Students</text>
<!-- subscription -->
<rect x="60" y="190" width="1320" height="585" rx="22" fill="#0c2441" stroke="#4ea8f4" stroke-width="3"/>
<rect x="86" y="173" width="290" height="36" rx="10" fill="#1478b8"/>
<text x="106" y="197" font-family="Arial,sans-serif" font-size="18" fill="white" font-weight="700">Azure Subscription</text>
<!-- resource group -->
<rect x="104" y="238" width="1224" height="488" rx="18" fill="#102b4a" stroke="#72b7eb" stroke-width="2.5" stroke-dasharray="12 8"/>
<rect x="130" y="221" width="365" height="34" rx="8" fill="#21527c"/>
<text x="145" y="244" fill="#e8f6ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Resource Group: rg-staticwebhosting-mark</text>
<!-- visitor -->
<rect x="155" y="360" width="235" height="194" rx="18" fill="#173a5e" stroke="#4e91c9" stroke-width="2" filter="url(#shadow)"/>
<circle cx="273" cy="415" r="29" fill="#244f79" stroke="#86d9ff" stroke-width="3"/>
<path d="M244 415h58M273 386c-17 14-17 44 0 58M273 386c17 14 17 44 0 58M248 402h50M248 429h50" fill="none" stroke="#86d9ff" stroke-width="2"/>
<text x="273" y="479" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Website Visitor</text>
<text x="273" y="506" text-anchor="middle" fill="#b7d0e6" font-family="Arial,sans-serif" font-size="15">Web browser</text>
<text x="273" y="530" text-anchor="middle" fill="#b7d0e6" font-family="Arial,sans-serif" font-size="14">Public Internet</text>
<!-- HTTPS connector -->
<path d="M390 455 H557" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="474" y="432" text-anchor="middle" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="16" font-weight="700">HTTPS GET</text>
<text x="474" y="484" text-anchor="middle" fill="#a6d7f2" font-family="Arial,sans-serif" font-size="14">Static website endpoint</text>
<!-- storage account -->
<rect x="570" y="307" width="665" height="334" rx="19" fill="#173e63" stroke="#47b5f5" stroke-width="3" filter="url(#shadow)"/>
<rect x="598" y="333" width="70" height="70" rx="14" fill="#147db6"/>
<path d="M614 351h39v31h-39z M614 359h39 M626 351v31 M640 351v31" stroke="#d6f2ff" stroke-width="3" fill="none"/>
<text x="687" y="356" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Azure Storage Account</text>
<text x="687" y="384" fill="#9fe1ff" font-family="Arial,sans-serif" font-size="19">stlab01mark2026</text>
<text x="600" y="432" fill="#c4d9e9" font-family="Arial,sans-serif" font-size="16">StorageV2  •  Standard LRS  •  Static website: Enabled</text>
<rect x="604" y="461" width="592" height="119" rx="13" fill="#0b2b48" stroke="#8ed9f7" stroke-width="2" stroke-dasharray="7 5"/>
<text x="630" y="493" fill="#a7e7ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Blob container: $web</text>
<rect x="630" y="510" width="188" height="47" rx="9" fill="#226c9c"/>
<text x="724" y="539" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">index.html</text>
<text x="847" y="530" fill="#d0e4f4" font-family="Arial,sans-serif" font-size="16">HTML + embedded CSS</text>
<text x="847" y="552" fill="#a7c4da" font-family="Arial,sans-serif" font-size="14">Served directly from Blob Storage</text>
<text x="605" y="613" fill="#a8e5ff" font-family="Arial,sans-serif" font-size="15">Blob soft delete: 7 days   •   Container soft delete: 7 days</text>
<!-- bottom badges -->
<rect x="157" y="596" width="366" height="92" rx="12" fill="#173650" stroke="#5e8fb4"/>
<text x="180" y="628" fill="#e9f5ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Deployment governance</text>
<text x="180" y="654" fill="#bcd5e6" font-family="Arial,sans-serif" font-size="15">Azure Policy: allowed regions only</text>
<text x="180" y="676" fill="#8fd8f7" font-family="Arial,sans-serif" font-size="15">North Central US selected</text>
<text x="74" y="823" fill="#e5f4ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Request flow</text>
<text x="222" y="823" fill="#b6d1e3" font-family="Arial,sans-serif" font-size="17">Visitor → HTTPS static website endpoint → $web container → index.html</text>
<text x="74" y="861" fill="#89a7bf" font-family="Arial,sans-serif" font-size="14">Architecture diagram • Azure Lab 01 • Public static content; no VM or web server required</text>
</svg>
